name: Deploy Terraform

on:
  workflow_run:
    workflows:
      - Validate
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  verify-current-main:
    name: Verify validated commit is current
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current-main.outputs.current }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Check whether main has moved on
        id: current-main
        uses: ./.github/actions/verify-current-main
        with:
          expected-sha: ${{ github.event.workflow_run.head_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Apply production infrastructure
    if: >-
      needs.verify-current-main.outputs.current == 'true'
    needs: verify-current-main
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_STATE_KEY: portfolio/production.tfstate
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Confirm main has not moved on
        id: current-main
        uses: ./.github/actions/verify-current-main
        with:
          expected-sha: ${{ github.event.workflow_run.head_sha }}
          fail-on-stale: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Initialize Terraform state
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config=r2.backend.json
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="endpoints={s3=\"$TF_STATE_ENDPOINT\"}"

      - name: Create Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Confirm main is current before applying
        uses: ./.github/actions/verify-current-main
        with:
          expected-sha: ${{ github.event.workflow_run.head_sha }}
          fail-on-stale: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Terraform plan
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Confirm main is current before uploading
        uses: ./.github/actions/verify-current-main
        with:
          expected-sha: ${{ github.event.workflow_run.head_sha }}
          fail-on-stale: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload frontend to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy frontend --project-name=portfolio --branch=main
          quiet: true

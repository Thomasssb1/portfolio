<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Thomas Beer's portfolio and work." />
    <meta name="theme-color" content="#f8f6f1" />
    <title>Thomas Beer</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      type="module"
      src="./components/scramble-text/scramble-text.js"
    ></script>
    <script
      type="module"
      src="./components/scroll-words/scroll-words.js"
    ></script>
    <script
      type="module"
      src="./components/icon-button/icon-button.js"
    ></script>
    <script
      type="module"
      src="./components/site-button/site-button.js"
    ></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="#top" aria-label="Thomas Beer, back to top">
          <scramble-text>Thomas Beer</scramble-text>
          <span class="wordmark-cursor" aria-hidden="true">_</span>
        </a>
        <div class="site-nav">
          <site-button variant="transparent" disabled title="Coming soon"
            >Work</site-button
          >
          <site-button variant="transparent" disabled title="Coming soon"
            >About</site-button
          >
          <site-button variant="transparent" disabled title="Coming soon"
            >CV</site-button
          >
        </div>
      </header>

      <main id="top">
        <section class="intro" aria-labelledby="intro-title">
          <p class="intro-label">
            <span class="intro-label-rule"></span> Hello, I'm Thomas
          </p>
          <h1 id="intro-title">
            I build
            <scroll-words words="apps,tools,libraries">apps.</scroll-words>
          </h1>

          <nav class="social-links" aria-label="Find me online">
            <icon-button
              icon="github"
              href="https://github.com/Thomasssb1"
              target="_blank"
              label="GitHub"
              >GitHub</icon-button
            >
            <icon-button
              icon="linkedin"
              href="https://www.linkedin.com/in/thomas-beer04/"
              target="_blank"
              label="LinkedIn"
              >LinkedIn</icon-button
            >
          </nav>
        </section>

        <section class="work" aria-labelledby="work-title">
          <div class="work-heading">
            <p class="section-label">
              <span class="section-label-rule"></span> Selected work
            </p>
            <h2 id="work-title">A few things I have been making.</h2>
          </div>

          <div class="featured-projects">
            <article class="featured-project">
              <div
                class="project-card project-card--featured project-card--blue"
                aria-hidden="true"
              ></div>
              <div class="project-info">
                <p>01 / Featured project</p>
                <h3>Project one</h3>
                <p>A short placeholder for a future case study.</p>
              </div>
            </article>

            <article class="featured-project featured-project--reverse">
              <div
                class="project-card project-card--featured project-card--green"
                aria-hidden="true"
              ></div>
              <div class="project-info">
                <p>02 / Featured project</p>
                <h3>Project two</h3>
                <p>A short placeholder for a future case study.</p>
              </div>
            </article>
          </div>

          <div class="project-grid">
            <div
              class="project-card project-card--wide project-card--dark"
              aria-hidden="true"
            ></div>
            <div
              class="project-card project-card--small project-card--peach"
              aria-hidden="true"
            ></div>
            <div
              class="project-card project-card--small project-card--sage"
              aria-hidden="true"
            ></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>

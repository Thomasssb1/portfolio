<!doctype html>
<html lang="en">
  <head>

  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="#top" aria-label="Thomas Beer, back to top">
          Thomas Beer<span class="wordmark-cursor" aria-hidden="true">_</span>

        <div class="site-nav">
          <span class="nav-item" title="Coming soon">Work</span>
          <span class="nav-item" title="Coming soon">About</span>
          <span class="nav-item" title="Coming soon">CV</span>
        </div>

      <main id="top">
        <section class="intro" aria-labelledby="intro-title">
          <p class="intro-label">
            <span class="intro-label-rule"></span> Hello, I'm Thomas
          </p>
          <h1 id="intro-title">
            I build
            <span class="visually-hidden">apps, tools, and libraries.</span>
            <span class="word-reel" aria-hidden="true">
              <span class="word-reel-track">
                <span>apps<span class="period">.</span></span>
                <span>tools<span class="period">.</span></span>
                <span>libraries<span class="period">.</span></span>
                <span>apps<span class="period">.</span></span>

            </span>

          <nav class="social-links" aria-label="Find me online">
            <a
              class="social-link"
              href="https://github.com/Thomasssb1"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub (opens in a new tab)"
            >
              <span class="social-icon-pair" aria-hidden="true">
                <img
                  class="social-icon"
                  src="./icons/github.svg"
                  alt=""
                  width="21"
                  height="21"
                />
                <img
                  class="social-icon social-icon-hover"
                  src="./icons/github-blue.svg"
                  alt=""
                  width="21"
                  height="21"
                />
              </span>
            </a>
            <a
              class="social-link"
              href="https://www.linkedin.com/in/thomas-beer04/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn (opens in a new tab)"
            >
              <span class="social-icon-pair" aria-hidden="true">
                <img
                  class="social-icon"
                  src="./icons/linkedin.svg"
                  alt=""
                  width="21"
                  height="21"
                />
                <img
                  class="social-icon social-icon-hover"

                  width="21"
                  height="21"
                />
              </span>
